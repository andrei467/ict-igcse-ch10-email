<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Communication — IGCSE ICT  Recap Grade 9</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue-50:#E6F1FB; --blue-100:#B5D4F4; --blue-200:#85B7EB; --blue-400:#378ADD; --blue-600:#185FA5; --blue-800:#0C447C; --blue-900:#042C53;
    --teal-50:#E1F5EE; --teal-200:#5DCAA5; --teal-600:#0F6E56; --teal-800:#085041;
    --amber-50:#FAEEDA; --amber-200:#EF9F27; --amber-600:#854F0B; --amber-800:#633806;
    --coral-50:#FAECE7; --coral-200:#F0997B; --coral-600:#993C1D; --coral-800:#712B13;
    --green-50:#EAF3DE; --green-200:#97C459; --green-600:#3B6D11; --green-800:#27500A;
    --purple-50:#EEEDFE; --purple-200:#AFA9EC; --purple-600:#534AB7; --purple-800:#3C3489;
    --gray-50:#F1EFE8; --gray-100:#D3D1C7; --gray-200:#B4B2A9; --gray-600:#5F5E5A;
    --text:#1a1a1a; --text-sec:#555; --text-hint:#888;
    --bg:#fff; --bg-sec:#f7f6f3; --border:rgba(0,0,0,0.12);
    --radius-sm:8px; --radius-md:12px; --radius-lg:16px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg-sec); color: var(--text); min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1rem 4rem; }
  .shell { width: 100%; max-width: 720px; }
  header { text-align: center; margin-bottom: 2rem; }
  header .topic-badge { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; background: var(--blue-50); color: var(--blue-800); padding: 4px 14px; border-radius: 20px; border: .5px solid var(--blue-200); margin-bottom: .75rem; }
  header h1 { font-size: 28px; font-weight: 600; color: var(--text); margin-bottom: .35rem; }
  header p { font-size: 15px; color: var(--text-sec); }
  .progress-wrap { margin-bottom: 1.5rem; }
  .prog-labels { display: flex; justify-content: space-between; margin-bottom: .5rem; }
  .prog-labels span { font-size: 12px; color: var(--text-hint); }
  .prog-track { height: 6px; background: var(--gray-100); border-radius: 3px; overflow: hidden; }
  .prog-fill { height: 100%; background: var(--blue-400); border-radius: 3px; transition: width .4s ease; }
  .slide-dots { display: flex; gap: 5px; margin-top: .75rem; flex-wrap: wrap; }
  .sdot { flex: 1; min-width: 20px; height: 4px; border-radius: 2px; background: var(--gray-100); transition: background .3s; cursor: pointer; }
  .sdot.done { background: var(--blue-200); }
  .sdot.active { background: var(--blue-600); }
  .card-shell { background: var(--bg); border-radius: var(--radius-lg); border: .5px solid var(--border); padding: 2rem; min-height: 360px; margin-bottom: 1.5rem; }
  .slide { display: none; animation: fi .3s ease; }
  .slide.visible { display: block; }
  @keyframes fi { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .slabel { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-hint); margin-bottom: .5rem; }
  .stitle { font-size: 24px; font-weight: 600; color: var(--text); margin-bottom: .75rem; }
  .ssub { font-size: 15px; color: var(--text-sec); margin-bottom: 1.5rem; line-height: 1.6; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .ic { padding: 1rem; border-radius: var(--radius-md); border: .5px solid; }
  .ic.blue{background:var(--blue-50);border-color:var(--blue-200);}
  .ic.teal{background:var(--teal-50);border-color:var(--teal-200);}
  .ic.amber{background:var(--amber-50);border-color:var(--amber-200);}
  .ic.coral{background:var(--coral-50);border-color:var(--coral-200);}
  .ic.green{background:var(--green-50);border-color:var(--green-200);}
  .ic.purple{background:var(--purple-50);border-color:var(--purple-200);}
  .ic.gray{background:var(--gray-50);border-color:var(--gray-200);}
  .ic-icon { font-size: 20px; margin-bottom: 6px; }
  .ic-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .ic.blue .ic-title{color:var(--blue-800);}
  .ic.teal .ic-title{color:var(--teal-800);}
  .ic.amber .ic-title{color:var(--amber-800);}
  .ic.coral .ic-title{color:var(--coral-800);}
  .ic.green .ic-title{color:var(--green-800);}
  .ic.purple .ic-title{color:var(--purple-800);}
  .ic.gray .ic-title{color:var(--gray-600);}
  .ic-body { font-size: 13px; color: var(--text-sec); line-height: 1.5; }
  .hbox { background: var(--blue-50); border: .5px solid var(--blue-200); border-radius: var(--radius-md); padding: 1rem 1.25rem; margin: 1rem 0; }
  .hbox p { font-size: 14px; color: var(--blue-800); line-height: 1.6; }
  .do-dont { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .dd-col { border-radius: var(--radius-md); padding: 1rem; border: .5px solid; }
  .dd-col.do{background:var(--green-50);border-color:var(--green-200);}
  .dd-col.dont{background:var(--coral-50);border-color:var(--coral-200);}
  .dd-col h3 { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
  .dd-col.do h3{color:var(--green-800);}
  .dd-col.dont h3{color:var(--coral-800);}
  .dd-col ul { list-style:none; display:flex; flex-direction:column; gap:6px; }
  .dd-col ul li { font-size: 13px; color: var(--text-sec); display:flex; gap:6px; align-items:flex-start; line-height:1.4; }
  .rlist { list-style:none; display:flex; flex-direction:column; gap:8px; margin-top:.5rem; }
  .rlist li { display:flex; align-items:flex-start; gap:8px; font-size:14px; color:var(--text); line-height:1.5; }
  .rlist li i { margin-top:2px; flex-shrink:0; }
  .qbtn { text-align:left; padding:.75rem 1rem; border-radius:var(--radius-sm); border:.5px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; cursor:pointer; transition:all .15s; width:100%; margin-bottom:8px; font-family:inherit; }
  .qbtn:hover { background:var(--bg-sec); }
  .qbtn.correct{background:var(--green-50);border-color:var(--green-200);color:var(--green-800);font-weight:600;}
  .qbtn.wrong{background:var(--coral-50);border-color:var(--coral-200);color:var(--coral-800);}
  .qbtn:disabled{pointer-events:none;}
  .feedback{margin-top:.75rem;font-size:14px;padding:.75rem 1rem;border-radius:var(--radius-sm);display:none;}
  .feedback.show{display:block;}
  .feedback.ok{background:var(--green-50);color:var(--green-800);border:.5px solid var(--green-200);}
  .feedback.no{background:var(--coral-50);color:var(--coral-800);border:.5px solid var(--coral-200);}
  .email-mock{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius-md);padding:1.25rem;font-size:13px;line-height:1.7;}
  .email-hdr{display:grid;grid-template-columns:60px 1fr;gap:4px 8px;margin-bottom:1rem;padding-bottom:1rem;border-bottom:.5px solid var(--border);}
  .email-lbl{font-size:12px;color:var(--text-hint);font-weight:600;}
  .email-val{font-size:13px;color:var(--text);}
  .clue-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 12px;border-radius:20px;border:.5px solid;background:transparent;cursor:pointer;margin:4px 4px 0 0;transition:all .15s;font-family:inherit;}
  .clue-btn.bad{border-color:var(--coral-200);color:var(--coral-800);}
  .clue-btn.bad.selected{background:var(--coral-50);}
  .clue-res{margin-top:1rem;font-size:14px;padding:.75rem 1rem;border-radius:var(--radius-sm);display:none;}
  .clue-res.show{display:block;}
  .scenario-card{padding:1rem;border-radius:var(--radius-md);border:.5px solid var(--border);background:var(--bg);margin-bottom:12px;}
  .sc-q{font-size:14px;color:var(--text);margin-bottom:.75rem;font-weight:600;}
  .sc-opts{display:flex;flex-wrap:wrap;gap:8px;}
  .sc-opt{padding:6px 14px;border-radius:20px;border:.5px solid var(--border);background:transparent;font-size:13px;color:var(--text);cursor:pointer;transition:all .15s;font-family:inherit;}
  .sc-opt:hover{background:var(--bg-sec);}
  .sc-opt.right{background:var(--green-50);border-color:var(--green-200);color:var(--green-800);}
  .sc-opt.wrong{background:var(--coral-50);border-color:var(--coral-200);color:var(--coral-800);}
  .sc-fb{font-size:12px;margin-top:8px;color:var(--text-sec);display:none;}
  .sc-fb.show{display:block;}
  .accordion-item{border:.5px solid var(--border);border-radius:var(--radius-md);margin-bottom:8px;overflow:hidden;}
  .accordion-btn{width:100%;text-align:left;padding:.875rem 1rem;background:var(--bg);border:none;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-family:inherit;}
  .accordion-btn:hover{background:var(--bg-sec);}
  .acc-title{font-size:14px;color:var(--text);line-height:1.5;font-weight:600;}
  .acc-icon{font-size:16px;flex-shrink:0;color:var(--text-hint);transition:transform .2s;}
  .acc-body{display:none;padding:0 1rem 1rem;}
  .acc-body p{font-size:13px;color:var(--text-sec);line-height:1.6;background:var(--blue-50);border-radius:var(--radius-sm);padding:.75rem;color:var(--blue-800);}
  .acc-body.def p{background:var(--bg-sec);color:var(--text-sec);}
  .checklist{display:flex;flex-direction:column;gap:8px;}
  .check-item{display:flex;align-items:center;gap:10px;padding:.75rem 1rem;border-radius:var(--radius-sm);border:.5px solid;}
  .check-item.blue{background:var(--blue-50);border-color:var(--blue-200);}
  .check-item.teal{background:var(--teal-50);border-color:var(--teal-200);}
  .check-item.amber{background:var(--amber-50);border-color:var(--amber-200);}
  .check-item.coral{background:var(--coral-50);border-color:var(--coral-200);}
  .check-item.green{background:var(--green-50);border-color:var(--green-200);}
  .check-item.purple{background:var(--purple-50);border-color:var(--purple-200);}
  .check-item.gray{background:var(--gray-50);border-color:var(--gray-200);}
  .check-item span{font-size:14px;font-weight:600;}
  .check-item.blue span{color:var(--blue-800);}
  .check-item.teal span{color:var(--teal-800);}
  .check-item.amber span{color:var(--amber-800);}
  .check-item.coral span{color:var(--coral-800);}
  .check-item.green span{color:var(--green-800);}
  .check-item.purple span{color:var(--purple-800);}
  .check-item.gray span{color:var(--gray-600);}
  .quiz-nav{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap;}
  .qnav-btn{min-width:34px;padding:5px 10px;border-radius:6px;border:.5px solid var(--border);background:transparent;cursor:pointer;font-size:13px;font-family:inherit;transition:all .15s;}
  .qnav-btn.q-done-right{background:var(--green-50);border-color:var(--green-200);color:var(--green-800);}
  .qnav-btn.q-done-wrong{background:var(--coral-50);border-color:var(--coral-200);color:var(--coral-800);}
  .score-box{text-align:center;padding:1.5rem;border-radius:var(--radius-md);background:var(--bg-sec);border:.5px solid var(--border);margin-top:1.5rem;}
  .score-num{font-size:52px;font-weight:700;color:var(--blue-600);}
  .score-lbl{font-size:14px;color:var(--text-sec);margin-top:4px;}
  .nav { display:flex; align-items:center; justify-content:space-between; }
  .nbtn { display:flex; align-items:center; gap:6px; padding:10px 20px; border-radius:var(--radius-sm); border:.5px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; cursor:pointer; transition:all .15s; font-family:inherit; font-weight:500; }
  .nbtn:hover { background:var(--bg-sec); }
  .nbtn:disabled { opacity:.3; cursor:default; }
  .nctr { font-size:13px; color:var(--text-hint); font-weight:500; }
  @media(max-width:520px){
    .grid2,.grid3,.do-dont{grid-template-columns:1fr;}
    .card-shell{padding:1.25rem;}
    header h1{font-size:22px;}
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="topic-badge">IGCSE ICT Recap</div>
    <h1>Email Communication</h1>
    <p>Grade 9 &nbsp;·&nbsp; Interactive Revision Presentation</p>
  </header>

  <div class="progress-wrap">
    <div class="prog-labels">
      <span id="slide-name">Introduction</span>
      <span id="slide-frac">1 / 14</span>
    </div>
    <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:7.14%"></div></div>
    <div class="slide-dots" id="slide-dots"></div>
  </div>

  <div class="card-shell">
    <div id="slides-wrap"></div>
  </div>

  <div class="nav">
    <button class="nbtn" id="prev-btn" onclick="navigate(-1)" disabled>
      <i class="ti ti-arrow-left"></i> Previous
    </button>
    <span class="nctr" id="nav-ctr">1 / 14</span>
    <button class="nbtn" id="next-btn" onclick="navigate(1)">
      Next <i class="ti ti-arrow-right"></i>
    </button>
  </div>
</div>

<script>
const slides = [
  {
    name: "Introduction",
    html: `
      <p class="slabel">Unit: Communication</p>
      <p class="stitle">Email Communication</p>
      <p class="ssub">Email is a method of exchanging messages and files over the internet. It is one of the most widely used tools for personal and professional communication.</p>
      <div class="grid3">
        <div class="ic blue">
          <div class="ic-icon"><i class="ti ti-user"></i></div>
          <div class="ic-title">Personal</div>
          <div class="ic-body">Staying in touch with friends and family</div>
        </div>
        <div class="ic teal">
          <div class="ic-icon"><i class="ti ti-briefcase"></i></div>
          <div class="ic-title">Professional</div>
          <div class="ic-body">Workplace correspondence and business</div>
        </div>
        <div class="ic amber">
          <div class="ic-icon"><i class="ti ti-speakerphone"></i></div>
          <div class="ic-title">Marketing</div>
          <div class="ic-body">Promoting products and services</div>
        </div>
      </div>
      <div class="hbox" style="margin-top:1.25rem;">
        <p><i class="ti ti-info-circle" style="margin-right:6px"></i>Companies provide <strong>guidelines</strong> about acceptable use of email, covering purpose, language, and security.</p>
      </div>
    `
  },
  {
    name: "Acceptable language",
    html: `
      <p class="slabel">Email Guidelines</p>
      <p class="stitle">Acceptable Language</p>
      <p class="ssub">The language you use depends on who you are writing to and why. Match your tone to your recipient and purpose.</p>
      <div class="do-dont">
        <div class="dd-col do">
          <h3><i class="ti ti-check" style="margin-right:4px"></i> Do</h3>
          <ul>
            <li><i class="ti ti-point" style="font-size:10px;margin-top:4px;color:var(--green-600)"></i>Use a professional tone for work emails</li>
            <li><i class="ti ti-point" style="font-size:10px;margin-top:4px;color:var(--green-600)"></i>Include a clear subject line</li>
            <li><i class="ti ti-point" style="font-size:10px;margin-top:4px;color:var(--green-600)"></i>Use professional salutations</li>
            <li><i class="ti ti-point" style="font-size:10px;margin-top:4px;color:var(--green-600)"></i>Use a professional email address</li>
          </ul>
        </div>
        <div class="dd-col dont">
          <h3><i class="ti ti-x" style="margin-right:4px"></i> Don't</h3>
          <ul>
            <li><i class="ti ti-point" style="font-size:10px;margin-top:4px;color:var(--coral-600)"></i>Use offensive or obscene language</li>
            <li><i class="ti ti-point" style="font-size:10px;margin-top:4px;color:var(--coral-600)"></i>Type in ALL CAPITALS (implies shouting)</li>
            <li><i class="ti ti-point" style="font-size:10px;margin-top:4px;color:var(--coral-600)"></i>Send racist or violent content</li>
            <li><i class="ti ti-point" style="font-size:10px;margin-top:4px;color:var(--coral-600)"></i>Send illegal material</li>
          </ul>
        </div>
      </div>
      <div class="hbox">
        <p><i class="ti ti-alert-circle" style="margin-right:6px"></i><strong>Important:</strong> Emails can be legally monitored. People can be punished for inappropriate content.</p>
      </div>
    `
  },
  {
    name: "Security & Netiquette",
    html: `
      <p class="slabel">Email Guidelines</p>
      <p class="stitle">Security & Netiquette</p>
      <p class="ssub">Protecting your inbox and respecting others online are both essential responsibilities.</p>
      <div class="grid2" style="margin-bottom:1rem;">
        <div class="ic blue">
          <div class="ic-icon"><i class="ti ti-lock"></i></div>
          <div class="ic-title">Email security</div>
          <div class="ic-body">Use strong passwords and change them often. Keep spam filters and antivirus software active to protect against passive and active attacks.</div>
        </div>
        <div class="ic purple">
          <div class="ic-icon"><i class="ti ti-world"></i></div>
          <div class="ic-title">Netiquette</div>
          <div class="ic-body">Internet + Etiquette. Respect others' opinions in online forums, messages, and emails.</div>
        </div>
      </div>
      <p style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px;">Netiquette tips:</p>
      <ul class="rlist">
        <li><i class="ti ti-eye" style="color:var(--purple-600);font-size:16px"></i>Most posts are public and can be read by anyone</li>
        <li><i class="ti ti-pencil" style="color:var(--purple-600);font-size:16px"></i>Use clear, inoffensive, and concise language</li>
        <li><i class="ti ti-star" style="color:var(--purple-600);font-size:16px"></i>Give a good impression — check tone, spelling, and grammar</li>
      </ul>
    `
  },
  {
    name: "Email operations",
    html: `
      <p class="slabel">Sending Emails</p>
      <p class="stitle">Key Email Operations</p>
      <p class="ssub">Four operations every email user must know.</p>
      <div class="grid2">
        <div class="ic blue">
          <div class="ic-icon"><i class="ti ti-copy"></i></div>
          <div class="ic-title">CC — Carbon Copy</div>
          <div class="ic-body">Include additional recipients. All recipients can see who received the email.</div>
        </div>
        <div class="ic teal">
          <div class="ic-icon"><i class="ti ti-eye-off"></i></div>
          <div class="ic-title">BCC — Blind Carbon Copy</div>
          <div class="ic-body">Additional recipients receive the email without others knowing.</div>
        </div>
        <div class="ic amber">
          <div class="ic-icon"><i class="ti ti-share"></i></div>
          <div class="ic-title">Forward</div>
          <div class="ic-body">Send an existing email to a new recipient.</div>
        </div>
        <div class="ic coral">
          <div class="ic-icon"><i class="ti ti-paperclip"></i></div>
          <div class="ic-title">Attachments</div>
          <div class="ic-body">Files sent alongside the email message.</div>
        </div>
      </div>
    `
  },
  {
    name: "Email groups",
    html: `
      <p class="slabel">Sending Emails</p>
      <p class="stitle">Email Groups</p>
      <p class="ssub">Email groups allow mass communication with a defined set of recipients, making it easier to reach many people at once.</p>
      <div class="grid2" style="margin-bottom:1rem;">
        <div class="ic green">
          <div class="ic-icon"><i class="ti ti-circle-check"></i></div>
          <div class="ic-title">Benefits</div>
          <div class="ic-body">Easier to send to many people at once. Ensures no one misses key information.</div>
        </div>
        <div class="ic coral">
          <div class="ic-icon"><i class="ti ti-circle-x"></i></div>
          <div class="ic-title">Drawbacks</div>
          <div class="ic-body">Spammers can exploit email groups to target large numbers of people easily.</div>
        </div>
      </div>
      <div class="hbox">
        <p><i class="ti ti-users" style="margin-right:6px"></i>Grouping addresses saves time — but be careful about who can access or join the group.</p>
      </div>
    `
  },
  {
    name: "Spam",
    html: `
      <p class="slabel">Spam</p>
      <p class="stitle">What is Spam?</p>
      <p class="ssub">Spam is unsolicited junk email sent in large quantities — often for advertising, phishing, or spreading malware.</p>
      <p style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px;">How to detect spam:</p>
      <ul class="rlist" style="margin-bottom:1.25rem;">
        <li><i class="ti ti-alert-triangle" style="color:var(--amber-600);font-size:16px"></i>Multiple spelling or grammatical errors</li>
        <li><i class="ti ti-alert-triangle" style="color:var(--amber-600);font-size:16px"></i>Does not address you by name</li>
        <li><i class="ti ti-alert-triangle" style="color:var(--amber-600);font-size:16px"></i>Asks you to click a link and enter your details</li>
        <li><i class="ti ti-alert-triangle" style="color:var(--amber-600);font-size:16px"></i>May use broken or unusual English</li>
      </ul>
      <p style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px;">How to prevent spam:</p>
      <ul class="rlist">
        <li><i class="ti ti-shield-check" style="color:var(--green-600);font-size:16px"></i>Use anti-spam filters from your email provider</li>
        <li><i class="ti ti-shield-check" style="color:var(--green-600);font-size:16px"></i>Do not agree to marketing emails when registering</li>
        <li><i class="ti ti-shield-check" style="color:var(--green-600);font-size:16px"></i>Never reply to suspicious emails with personal data</li>
        <li><i class="ti ti-shield-check" style="color:var(--green-600);font-size:16px"></i>Visit websites directly instead of clicking email links</li>

    `
  },
  {
    name: "Quiz — Part 1",
    html: `
      <p class="slabel">Test yourself — Part 1</p>

    `
  },
  {

        <button class="clue-btn bad" onclick="clue(this,'Does not address you by name — just &quot;Valued Customer&quot;. Legitimate companies use your name.')"><i class="ti ti-user-off"></i> No name used</button>
        <button class="clue-btn bad" onclick="clue(this,'Suspicious .ru link — not a bank domain. Never click links like this! Go to the website directly.')"><i class="ti ti-link"></i> Suspicious link</button>
        <button class="clue-btn bad" onclick="clue(this,'A 24-hour deadline is a scare tactic to rush you into acting without thinking.')"><i class="ti ti-clock"></i> Fake urgency</button>

  },
  {

    html: `
      <p class="slabel">Activity</p>
      <p class="stitle">Email scenarios</p>

  {

  },
  {

    html: `

        ].map(([t,c])=>`<div class="check-item ${c}"><i class="ti ti-circle-check" style="font-size:18px;flex-shrink:0"></i><span>${t}</span></div>`).join('')}

const quiz1 = [
  {q:"What does BCC stand for?",opts:["Bold Carbon Copy","Blind Carbon Copy","Basic Copy Command","Batch CC"],correct:1,explain:"BCC = Blind Carbon Copy. Other recipients cannot see who was BCC'd."},
  {q:"Which of the following helps identify a spam email?",opts:["It addresses you by your full name","It has many spelling errors and asks you to click a link","It comes from a known company's official domain","It contains a professional signature"],correct:1,explain:"Spam often has spelling errors and contains suspicious links asking for personal details."},
  {q:"What is Netiquette?",opts:["A type of anti-virus software","Rules for formatting emails","Respectful behaviour online","A spam detection method"],correct:2,explain:"Netiquette = Internet + Etiquette. It means respecting others in online communication."},
  {q:"Why should you NOT type emails in ALL CAPITALS?",opts:["It uses more data","It implies you are shouting","It is harder for spam filters to read","It breaks email formatting"],correct:1,explain:"ALL CAPS is considered the digital equivalent of shouting and is poor netiquette."},
  {q:"What is the safest way to log into a website mentioned in an email?",opts:["Click the link in the email","Reply to ask for the link","Type the website address directly in your browser","Forward it to a trusted friend"],correct:2,explain:"Always navigate to websites yourself — this protects you from phishing."},
];

const quiz2 = [
  {q:"Which email operation hides recipient addresses from each other?",opts:["CC","Reply All","BCC","Forward"],correct:2,explain:"BCC (Blind Carbon Copy) means other recipients cannot see who else received the email."},
  {q:"What is phishing?",opts:["A type of spam filter","Sending emails to email groups","Pretending to be a trusted company to steal personal details","Using broken English in emails"],correct:2,explain:"Phishing emails impersonate trusted organisations to trick you into revealing personal details."},
  {q:"Which of these is an example of good netiquette?",opts:["Typing in all capitals to emphasise a point","Using clear and inoffensive language","Sending chain emails to everyone you know","Replying to all with personal opinions"],correct:1,explain:"Good netiquette includes using clear, polite, and appropriate language in all online communication."},
  {q:"An email asks you to 'VERIFY YOUR ACCOUNT IMMEDIATELY or it will be suspended'. This is most likely:",opts:["A genuine security alert","A marketing email","A phishing/spam email using scare tactics","An email group message"],correct:2,explain:"Fake urgency and threats are classic spam/phishing tactics to pressure you into acting without thinking."},
];

const examQs = [
  {q:"State two features that suggest an email is spam. [2]",marks:"1 mark each for any two of: spelling/grammar errors; does not address recipient by name; suspicious sender address; asks you to click a link and enter details; uses broken English; creates false urgency."},
  {q:"Describe what is meant by 'netiquette'. [2]",marks:"Netiquette = internet etiquette (1 mark); a set of guidelines for respectful and appropriate behaviour when communicating online (1 mark)."},
  {q:"Explain one benefit and one drawback of using email groups. [4]",marks:"Benefit (2 marks): easier/faster to send to many people at once (1) so no one misses important information (1). Drawback (2 marks): spammers can target email groups (1) making it easy to send malicious messages to large numbers of people at once (1)."},
  {q:"Explain why email users should use strong passwords. [2]",marks:"Strong passwords protect the inbox from unauthorised access (1); preventing sensitive information from being stolen or altered (1)."},
];

const glossary = [
  {t:"Spam",d:"Unsolicited junk email sent in bulk, often for advertising, phishing, or spreading malware."},
  {t:"Phishing",d:"A type of spam that impersonates a trusted company to trick users into giving personal details such as passwords."},
  {t:"Netiquette",d:"Internet + Etiquette. The accepted code of polite, respectful behaviour in online communication."},
  {t:"CC (Carbon Copy)",d:"Sends a copy of the email to additional recipients. All recipients can see each other's addresses."},
  {t:"BCC (Blind Carbon Copy)",d:"Sends a copy to additional recipients without other recipients knowing they were included."},
  {t:"Spam filter",d:"Software that automatically detects and blocks unwanted emails before they reach your inbox."},
  {t:"Antivirus software",d:"Software that detects and removes malicious software, including threats delivered via email."},
  {t:"Active attack",d:"A deliberate attempt to access or alter data — for example, hacking into an email account."},
  {t:"Passive attack",d:"Monitoring or intercepting data without altering it — for example, eavesdropping on email traffic."},
  {t:"Email group",d:"A named list of email addresses allowing one email to be sent to multiple recipients simultaneously."},
];

let cur = 0;
let q1Answers = {}, q2Answers = {};
let q1Score = 0, q2Score = 0;
let clueCount = 0;
let scDone = {};

function renderProgress() {
  const fill = ((cur + 1) / slides.length * 100).toFixed(1);
  document.getElementById('prog-fill').style.width = fill + '%';
  document.getElementById('slide-name').textContent = slides[cur].name;
  document.getElementById('slide-frac').textContent = (cur + 1) + ' / ' + slides.length;
  document.getElementById('nav-ctr').textContent = (cur + 1) + ' / ' + slides.length;
  const dots = document.getElementById('slide-dots');
  dots.innerHTML = slides.map((s, i) => `<div class="sdot ${i < cur ? 'done' : i === cur ? 'active' : ''}" title="${s.name}" onclick="goTo(${i})"></div>`).join('');
}

function renderSlide() {
  const wrap = document.getElementById('slides-wrap');
  wrap.innerHTML = `<div class="slide visible">${slides[cur].html}</div>`;
  if (cur === 6) renderQuiz('quiz-container', quiz1, q1Answers, 1);
  if (cur === 10) renderExamQs();
  if (cur === 11) renderGlossary();
  if (cur === 12) renderQuiz('quiz2-container', quiz2, q2Answers, 2);
  if (cur === 13) renderFinalScores();
  document.getElementById('prev-btn').disabled = cur === 0;
  document.getElementById('next-btn').disabled = cur === slides.length - 1;
  renderProgress();
}

function renderQuiz(containerId, questions, answers, quizNum) {
  const c = document.getElementById(containerId);
  if (!c) return;
  let html = '<div class="quiz-nav">';
  questions.forEach((_, i) => {
    let cls = '';
    if (answers[i] !== undefined) cls = answers[i] === questions[i].correct ? 'q-done-right' : 'q-done-wrong';
    html += `<button class="qnav-btn ${cls}" onclick="showQ('${containerId}',${i},${quizNum})">${i + 1}</button>`;
  });
  html += '</div><div id="' + containerId + '-qdisplay"></div>';
  c.innerHTML = html;
  showQ(containerId, 0, quizNum);
}

function showQ(containerId, i, quizNum) {
  const questions = quizNum === 1 ? quiz1 : quiz2;
  const answers = quizNum === 1 ? q1Answers : q2Answers;
  const d = questions[i];
  const answered = answers[i] !== undefined;
  let html = `<p style="font-size:16px;font-weight:600;color:var(--text);margin-bottom:1rem;">${i + 1}. ${d.q}</p>`;
  d.opts.forEach((opt, j) => {
    let cls = 'qbtn';
    if (answered) {
      if (j === d.correct) cls += ' correct';
      else if (j === answers[i]) cls += ' wrong';
      cls += ' disabled';
    }
    html += `<button class="${cls}" onclick="${answered ? '' : `answerQ('${containerId}',${i},${j},${quizNum})`}">${opt}</button>`;
  });
  if (answered) {
    const ok = answers[i] === d.correct;
    html += `<div class="feedback show ${ok ? 'ok' : 'no'}">${ok ? '✓ Correct! ' : '✗ Not quite. '}${d.explain}</div>`;
  }
  document.getElementById(containerId + '-qdisplay').innerHTML = html;
}

function answerQ(containerId, qi, ai, quizNum) {
  const questions = quizNum === 1 ? quiz1 : quiz2;
  const answers = quizNum === 1 ? q1Answers : q2Answers;
  if (answers[qi] !== undefined) return;
  answers[qi] = ai;
  if (ai === questions[qi].correct) {
    if (quizNum === 1) q1Score++; else q2Score++;
  }
  renderQuiz(containerId, questions, answers, quizNum);
  showQ(containerId, qi, quizNum);
}

function renderExamQs() {
  const c = document.getElementById('eq-container');
  if (!c) return;
  c.innerHTML = examQs.map((q, i) => `
    <div class="accordion-item">
      <button class="accordion-btn" onclick="toggleAcc('eq${i}','eq-ic${i}')">
        <span class="acc-title">${q.q}</span>
        <i class="ti ti-chevron-down acc-icon" id="eq-ic${i}"></i>
      </button>
      <div class="acc-body" id="eq${i}"><p>${q.marks}</p></div>
    </div>
  `).join('');
}

function renderGlossary() {
  const c = document.getElementById('glossary-container');
  if (!c) return;
  c.innerHTML = glossary.map((g, i) => `
    <div class="accordion-item">
      <button class="accordion-btn" onclick="toggleAcc('g${i}','g-ic${i}')">
        <span class="acc-title">${g.t}</span>
        <i class="ti ti-chevron-down acc-icon" id="g-ic${i}"></i>
      </button>
      <div class="acc-body def" id="g${i}"><p>${g.d}</p></div>
    </div>
  `).join('');
}

function toggleAcc(bodyId, iconId) {
  const body = document.getElementById(bodyId);
  const icon = document.getElementById(iconId);
  const open = body.style.display === 'block';
  body.style.display = open ? 'none' : 'block';
  icon.style.transform = open ? '' : 'rotate(180deg)';
}

function renderFinalScores() {
  const c = document.getElementById('final-scores');
  if (!c) return;
  const total = q1Score + q2Score;
  const max = quiz1.length + quiz2.length;
  c.innerHTML = `
    <div class="score-box">
      <div class="score-num">${total}/${max}</div>
      <div class="score-lbl">Total quiz score &nbsp;·&nbsp; Quiz 1: ${q1Score}/${quiz1.length} &nbsp;·&nbsp; Quiz 2: ${q2Score}/${quiz2.length}</div>
    </div>
  `;
}

function clue(btn, msg) {
  if (btn.dataset.done === '1') return;
  btn.dataset.done = '1';
  btn.classList.add('selected');
  clueCount++;
  const res = document.getElementById('clue-res');
  res.className = 'clue-res show';
  res.style.cssText = 'background:var(--amber-50);border:.5px solid var(--amber-200);color:var(--amber-800);';
  res.innerHTML = `<i class="ti ti-alert-triangle" style="margin-right:6px"></i>${msg}`;
  if (clueCount >= 6) {
    res.style.cssText = 'background:var(--coral-50);border:.5px solid var(--coral-200);color:var(--coral-800);';
    res.innerHTML = `<i class="ti ti-shield-x" style="margin-right:6px"></i><strong>This is definitely spam!</strong> You found all 6 red flags. Never click links or share details from emails like this.`;
  }
}

function sc(btn, idx, correct, explain) {
  if (scDone[idx]) return;
  scDone[idx] = true;
  btn.classList.add(correct ? 'right' : 'wrong');
  btn.parentElement.querySelectorAll('.sc-opt').forEach(s => { s.style.pointerEvents = 'none'; });
  const fb = document.getElementById('sc-fb-' + idx);
  if (fb) { fb.className = 'sc-fb show'; fb.style.color = correct ? 'var(--green-800)' : 'var(--coral-800)'; fb.textContent = (correct ? '✓ ' : '✗ ') + explain; }
}

function navigate(dir) {
  cur = Math.max(0, Math.min(slides.length - 1, cur + dir));
  clueCount = 0; scDone = {};
  renderSlide();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goTo(i) {
  cur = i;
  clueCount = 0; scDone = {};
  renderSlide();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderSlide();
</script>
